<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Formula Editor</title>

    <script
      type="text/javascript"
      src="js/mathjax/MathJax.js?config=TeX-AMS-MML_SVG"
    ></script>
    <script type="text/javascript" src="js/formula.min.js"></script>
    <script type="text/javascript">
      window.onload = function() {
        window.parameters = Url.get;
        window.EditorObj = new Editor(
          window.actions,
          window.panels,
          parameters
        );
        window.getData = function(callback) {
          EditorObj.getEquationPng(callback);
        };

        // Soporte cross-origin: la ventana padre de TinyMCE (otro dominio)
        // no puede llamar a getData() directamente, así que respondemos por postMessage.
        window.addEventListener("message", function(event) {
          var data = event.data;
          if (!data || data.type !== "tinymceFormula:getData") {
            return;
          }
          EditorObj.getEquationPng(function(png, mlang, equation) {
            event.source.postMessage({
              type: "tinymceFormula:data",
              requestId: data.requestId,
              png: png,
              mlang: mlang,
              equation: equation
            }, event.origin);
          });
        });
      };
    </script>
    <link rel="stylesheet" type="text/css" href="css/formula.min.css" />
  </head>
  <body id="fm-editor-body"></body>
</html>
